<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giro Industrial — Stellantis Córdoba</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap');
:root{
  --bg:#f4f6f9;--s1:#ffffff;--s2:#f0f2f5;--s3:#e8ebef;
  --border:#d8dde6;--border2:#c5ccd8;
  --text:#1a2035;--muted:#6b7a94;--muted2:#8892a4;
  --cronos:#0066cc;--dakota:#cc2200;--titano:#cc7700;--total:#1a6e3a;
  --green:#1a8a4a;--red:#cc2200;--orange:#cc7700;
  --accent:#1d3a8a;
  --d2:#8892a4;--d30:#cc7700;--d50:#cc4400;--d60:#cc2200;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 60px;}

/* HEADER */
.header{background:var(--accent);padding:0 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.header-logo img{height:52px;width:auto;display:block;padding:6px 0;}
.header-title{color:rgba(255,255,255,.85);font-family:'Rajdhani',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;text-align:right;}
.header-title strong{display:block;color:#fff;font-size:1.1rem;letter-spacing:2px;}

/* SUBHEADER */
.subheader{display:flex;align-items:center;justify-content:space-between;padding:14px 0;margin-bottom:16px;border-bottom:2px solid var(--border);}
.page-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.badge{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted);background:var(--s2);border:1px solid var(--border);padding:5px 12px;letter-spacing:1px;border-radius:4px;}
.badge.highlight{background:var(--accent);color:#fff;border-color:var(--accent);}

/* UPLOAD BAR */
.upload-bar{background:var(--s1);border:1px solid var(--border);border-left:4px solid var(--accent);padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:0 6px 6px 0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.upload-btn{background:var(--accent);color:#fff;font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:9px 20px;cursor:pointer;border:none;border-radius:4px;transition:opacity .2s;}
.upload-btn:hover{opacity:.85;}
.download-btn{background:var(--green);color:#fff;font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:9px 20px;cursor:pointer;border:none;border-radius:4px;transition:opacity .2s;display:none;}
.download-btn:hover{opacity:.85;}
.download-btn.visible{display:block;}
.upload-status{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--green);display:none;align-items:center;gap:6px;}
.upload-status.visible{display:flex;}
.udot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.embed-info{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--muted2);margin-left:auto;}

/* FILTROS */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center;background:var(--s1);padding:12px 16px;border-radius:6px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.fgroup{display:flex;gap:3px;flex-wrap:wrap;}
.flabel{font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-right:4px;align-self:center;white-space:nowrap;}
.fbtn{background:var(--s2);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;cursor:pointer;transition:all .15s;border-radius:4px;}
.fbtn:hover{border-color:var(--accent);color:var(--accent);background:rgba(29,58,138,.05);}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.fbtn.act-cronos{background:var(--cronos);border-color:var(--cronos);color:#fff;}
.fbtn.act-dakota{background:var(--dakota);border-color:var(--dakota);color:#fff;}
.fbtn.act-titano{background:var(--titano);border-color:var(--titano);color:#fff;}
.sep{width:1px;height:28px;background:var(--border);margin:0 4px;}
select{background:var(--s1);border:1px solid var(--border);color:var(--text);font-family:'Exo 2',sans-serif;font-size:.78rem;padding:6px 10px;cursor:pointer;outline:none;transition:border-color .15s;max-width:200px;border-radius:4px;}
select:focus{border-color:var(--accent);}

/* MODEL CARDS */
.model-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:800px){.model-row{grid-template-columns:repeat(2,1fr);}}
.mcard{background:var(--s1);border:1px solid var(--border);border-top:3px solid var(--mc);padding:16px;border-radius:0 0 6px 6px;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:transform .15s,box-shadow .15s;}
.mcard:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);}
.mc-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--mc);margin-bottom:8px;}
.mc-big{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:3rem;line-height:1;color:var(--mc);}
.mc-sub{font-size:.6rem;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-family:'Share Tech Mono',monospace;}
.mc-alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.mc-alert{text-align:center;padding:4px 2px;border-radius:3px;cursor:pointer;transition:background .15s;}
.mc-alert:hover{background:var(--s2);}
.mc-alert .av{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;}
.mc-alert .al{font-size:.52rem;color:var(--muted2);letter-spacing:.5px;font-family:'Share Tech Mono',monospace;}

/* ZONA CARDS */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr);}}
.kcard{background:var(--s1);border:1px solid var(--border);border-top:3px solid var(--kc,var(--accent));padding:14px;border-radius:0 0 6px 6px;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:transform .15s;cursor:pointer;}
.kcard:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1);}
.kc-zona{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--kc,var(--accent));margin-bottom:8px;}
.kc-models{display:flex;flex-direction:column;gap:4px;}
.km{display:flex;justify-content:space-between;align-items:baseline;}
.km-name{font-size:.62rem;color:var(--muted2);letter-spacing:1px;font-family:'Share Tech Mono',monospace;}
.km-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.2rem;}
.kc-total{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;}
.t-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.8rem;color:var(--kc,var(--accent));}
.t-lbl{font-size:.55rem;color:var(--muted2);letter-spacing:1px;font-family:'Share Tech Mono',monospace;}

/* CHART */
.chart-panel{background:var(--s1);border:1px solid var(--border);padding:20px;margin-bottom:16px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.cp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.cp-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
.leg-row{display:flex;gap:12px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:.68rem;color:var(--muted);font-family:'Share Tech Mono',monospace;}
.leg-dot{width:8px;height:8px;border-radius:2px;}
.chart-wrap{position:relative;height:220px;}

/* ALERT TABS */
.alert-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
.atab{background:var(--s1);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;border-radius:4px;}
.atab:hover{border-color:var(--accent);color:var(--accent);}
.atab.active{color:#fff;}
.atab.at-all.active{background:var(--accent);border-color:var(--accent);}
.atab.at-2.active{background:var(--d2);border-color:var(--d2);}
.atab.at-30.active{background:var(--d30);border-color:var(--d30);}
.atab.at-50.active{background:var(--d50);border-color:var(--d50);}
.atab.at-60.active{background:var(--d60);border-color:var(--d60);}
.atab .cnt{font-size:.85rem;font-weight:700;background:rgba(0,0,0,.15);padding:1px 7px;border-radius:3px;}

/* TABLE */
.tbl-panel{background:var(--s1);border:1px solid var(--border);padding:20px;overflow-x:auto;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.sec-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
.srch{background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'Exo 2',sans-serif;font-size:.78rem;padding:7px 12px;outline:none;width:220px;transition:border-color .2s;border-radius:4px;}
.srch:focus{border-color:var(--accent);}
.srch::placeholder{color:var(--muted2);}
table{width:100%;border-collapse:collapse;font-size:.8rem;}
thead tr{border-bottom:2px solid var(--border);}
th{font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);padding:9px 12px;text-align:left;cursor:pointer;white-space:nowrap;user-select:none;}
th:hover{color:var(--text);}
td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.78rem;color:var(--text);}
tr:hover td{background:var(--s2);}
.tag-cronos{color:var(--cronos);font-weight:600;}.tag-dakota{color:var(--dakota);font-weight:600;}.tag-titano{color:var(--titano);font-weight:600;}
.days-ok{color:var(--muted2);}.days-2{color:var(--d2);font-weight:600;}.days-30{color:var(--d30);font-weight:700;}.days-50{color:var(--d50);font-weight:700;}.days-60{color:var(--d60);font-weight:700;}
.badge-d{display:inline-block;padding:2px 8px;font-size:.62rem;font-weight:700;border-radius:3px;}
.badge-d.d60{background:rgba(204,34,0,.1);color:var(--d60);border:1px solid rgba(204,34,0,.25);}
.badge-d.d50{background:rgba(204,68,0,.1);color:var(--d50);border:1px solid rgba(204,68,0,.25);}
.badge-d.d30{background:rgba(204,119,0,.1);color:var(--d30);border:1px solid rgba(204,119,0,.25);}
.badge-d.d2{background:rgba(136,146,164,.1);color:var(--d2);border:1px solid rgba(136,146,164,.25);}
.badge-d.d0{color:var(--muted2);border:1px solid var(--border);}
.pag{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:flex-end;}
.pag-btn{background:var(--s2);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:1px;padding:6px 14px;cursor:pointer;transition:all .15s;border-radius:4px;}
.pag-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);background:rgba(29,58,138,.05);}.pag-btn:disabled{opacity:.35;cursor:default;}
.pag-info{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted);}
.tally{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted2);}
</style>
</head>

function initVer(data){

function downloadHTML(){
  const ts=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const ds=ts.replace(/\//g,'-');
  const cur=document.documentElement.outerHTML;
  const upd=cur
    .replace(/let RAW=\[[\s\S]*?\];/,'let RAW='+JSON.stringify(RAW)+';')
    .replace(/<span class="embed-info">.*?<\/span>/,'<span class="embed-info">Datos: '+ts+' · '+RAW.length+' chasis embebidos<\/span>')
    .replace(/<span class="badge" id="date-badge">.*?<\/span>/,'<span class="badge" id="date-badge">'+ts+'<\/span>')
    .replace(/<span class="badge highlight" id="total-badge">.*?<\/span>/,'<span class="badge highlight" id="total-badge">'+RAW.length+' CHASIS<\/span>');
  const blob=new Blob([upd],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='giro_'+ds+'.html';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function loadExcel(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      const today=new Date();today.setHours(0,0,0,0);
      function gz(est){const e=String(est||'').trim().toUpperCase();if(e.startsWith('E'))return'E-M';if(e.startsWith('M'))return'M-F';if(e.startsWith('F'))return'F-X';if(e.startsWith('X'))return'X-G';return'OTRO';}
      const nd=[];
      for(let i=1;i<rows.length;i++){
        const r=rows[i];if(!r||!r[5])continue;
        let dt=r[5] instanceof Date?r[5]:new Date(r[5]);if(isNaN(dt))continue;
        dt.setHours(0,0,0,0);
        const dias=Math.round((today-dt)/86400000);
        const mc=String(r[3]||'').trim(),est=String(r[16]||'').trim();
        nd.push({chasis:String(r[9]||'').trim(),modelo:MM[mc]||mc,ver:String(r[12]||'').trim(),estacion:est,zona:gz(est),dias,dt_tr:dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})});
      }
      RAW=nd;initVer(RAW);
      const ts=new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
      document.getElementById('date-badge').textContent=ts;
      document.getElementById('total-badge').textContent=nd.length+' CHASIS';
      document.getElementById('upload-msg').textContent=file.name+' · '+nd.length+' chasis cargados';
      document.getElementById('upload-status').classList.add('visible');
      document.getElementById('download-btn').classList.add('visible');
      fModelo='TODOS';fZona='TODAS';fVer='TODAS';fAlerta='TODOS';fSearch='';page=1;
      document.querySelectorAll('#fg-modelo .fbtn').forEach((b,i)=>b.className=i===0?'fbtn active':'fbtn');
      document.querySelectorAll('#fg-zona .fbtn').forEach((b,i)=>b.className=i===0?'fbtn active':'fbtn');
      render();
    }catch(err){alert('Error: '+err.message);}
  };reader.readAsArrayBuffer(file);
}

function sortBy(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=col==='dias'?-1:1;}render();}

function getBase(){return RAW.filter(r=>{if(fModelo!=='TODOS'&&r.modelo!==fModelo)return false;if(fZona!=='TODAS'&&r.zona!==fZona)return false;if(fVer!=='TODAS'&&r.ver!==fVer)return false;if(fSearch&&!r.chasis.toUpperCase().includes(fSearch))return false;return true;});}
function getFilt(base){return base.filter(r=>{if(fAlerta==='>2'&&r.dias<=2)return false;if(fAlerta==='>30'&&r.dias<=30)return false;if(fAlerta==='>50'&&r.dias<=50)return false;if(fAlerta==='>60'&&r.dias<=60)return false;return true;});}
function dc(d){if(d>60)return'days-60';if(d>50)return'days-50';if(d>30)return'days-30';if(d>2)return'days-2';return'days-ok';}
function db(d){if(d>60)return'<span class="badge-d d60">+60D</span>';if(d>50)return'<span class="badge-d d50">+50D</span>';if(d>30)return'<span class="badge-d d30">+30D</span>';if(d>2)return'<span class="badge-d d2">+2D</span>';return'<span class="badge-d d0">OK</span>';}
function mC(m){return m==='CRONOS'?'var(--cronos)':m==='DAKOTA'?'var(--dakota)':m==='TITANO'?'var(--titano)':'var(--total)';}

function render(){

  filtered.sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}return va<vb?-sortDir:va>vb?sortDir:0;});

  document.getElementById('cnt-60').textContent=base.filter(r=>r.dias>60).length;
  document.getElementById('total-badge').textContent=filtered.length+' CHASIS';
  document.getElementById('tally-txt').textContent=filtered.length+' resultados';
  renderModelCards(base);renderZonaCards(base);renderChart(base);
  const tp=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  page=Math.min(page,tp);
  const pg=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
  document.getElementById('pag-info').textContent=page+'/'+tp;
  document.getElementById('btn-prev').disabled=page<=1;document.getElementById('btn-next').disabled=page>=tp;
  const tbody=document.getElementById('tbl-body');tbody.innerHTML='';
  pg.forEach(r=>{
    const mc=r.modelo==='CRONOS'?'tag-cronos':r.modelo==='DAKOTA'?'tag-dakota':'tag-titano';
    tbody.innerHTML+=`<tr><td style="font-weight:600;">${r.chasis}</td><td class="${mc}">${r.modelo}</td><td>${r.ver}</td><td>${r.zona}</td><td>${r.estacion}</td><td>${r.dt_tr}</td><td class="${dc(r.dias)}">${r.dias}</td><td>${db(r.dias)}</td></tr>`;
  });
}

function renderModelCards(data){
  const COLORS={CRONOS:'var(--cronos)',DAKOTA:'var(--dakota)',TITANO:'var(--titano)',TOTAL:'var(--total)'};
  const grid=document.getElementById('model-cards');grid.innerHTML='';
  ['CRONOS','DAKOTA','TITANO','TOTAL'].forEach(m=>{
    const arr=m==='TOTAL'?data:data.filter(r=>r.modelo===m);
    const d60=arr.filter(r=>r.dias>60).length,d50=arr.filter(r=>r.dias>50&&r.dias<=60).length,d30=arr.filter(r=>r.dias>30&&r.dias<=50).length,d2=arr.filter(r=>r.dias>2&&r.dias<=30).length;
    grid.innerHTML+=`<div class="mcard" style="--mc:${COLORS[m]}">
      <div class="mc-label">${m}</div>
      <div class="mc-big">${arr.length}</div>
      <div class="mc-sub">CHASIS E-G</div>
      <div class="mc-alerts">
        <div class="mc-alert"><div class="av" style="color:var(--d2)">${d2}</div><div class="al">&gt;2D</div></div>
        <div class="mc-alert"><div class="av" style="color:var(--d30)">${d30}</div><div class="al">&gt;30D</div></div>
        <div class="mc-alert"><div class="av" style="color:var(--d50)">${d50}</div><div class="al">&gt;50D</div></div>
        <div class="mc-alert"><div class="av" style="color:var(--d60)">${d60}</div><div class="al">&gt;60D</div></div>
      </div>
    </div>`;
  });
}

function renderZonaCards(data){
  const ZC={'E-M':'#0066cc','M-F':'#6644aa','F-X':'#1a7a4a','X-G':'#cc7700','E-G':'#1d3a8a'};
  const grid=document.getElementById('zona-cards');grid.innerHTML='';
  ['E-M','M-F','F-X','X-G','E-G'].forEach(z=>{
    const arr=z==='E-G'?data:data.filter(r=>r.zona===z);
    const cr=arr.filter(r=>r.modelo==='CRONOS').length,dk=arr.filter(r=>r.modelo==='DAKOTA').length,ti=arr.filter(r=>r.modelo==='TITANO').length;
    const zf=z==='E-G'?'TODAS':z;
    grid.innerHTML+=`<div class="kcard" onclick="setZona('${zf}',this)" style="--kc:${ZC[z]}">
      <div class="kc-zona">${z}</div>
      <div class="kc-models">
        <div class="km"><span class="km-name" style="color:var(--cronos)">CRONOS</span><span class="km-val" style="color:var(--cronos)">${cr}</span></div>
        <div class="km"><span class="km-name" style="color:var(--dakota)">DAKOTA</span><span class="km-val" style="color:var(--dakota)">${dk}</span></div>
        <div class="km"><span class="km-name" style="color:var(--titano)">TITANO</span><span class="km-val" style="color:var(--titano)">${ti}</span></div>
      </div>
      <div class="kc-total"><span class="t-val">${arr.length}</span><span class="t-lbl">TOTAL<br>CHASIS</span></div>
    </div>`;
  });
}

function renderChart(data){
  const L=['E-M','M-F','F-X','X-G'];
  const crD=L.map(z=>data.filter(r=>r.zona===z&&r.modelo==='CRONOS').length);
  const dkD=L.map(z=>data.filter(r=>r.zona===z&&r.modelo==='DAKOTA').length);
  const tiD=L.map(z=>data.filter(r=>r.zona===z&&r.modelo==='TITANO').length);
  if(zChart)zChart.destroy();
  zChart=new Chart(document.getElementById('zona-chart').getContext('2d'),{
    type:'bar',
    data:{labels:L,datasets:[
      {label:'Cronos',data:crD,backgroundColor:'rgba(0,102,204,.75)',borderColor:'#0066cc',borderWidth:1},
      {label:'Dakota',data:dkD,backgroundColor:'rgba(204,34,0,.75)',borderColor:'#cc2200',borderWidth:1},
      {label:'Titano',data:tiD,backgroundColor:'rgba(204,119,0,.75)',borderColor:'#cc7700',borderWidth:1},
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:'#6b7a94',font:{size:10}}},tooltip:{backgroundColor:'#fff',borderColor:'#d8dde6',borderWidth:1,titleColor:'#1a2035',bodyColor:'#6b7a94',padding:10}},
      scales:{
        x:{stacked:true,grid:{color:'rgba(0,0,0,.06)'},ticks:{color:'#6b7a94',font:{size:10}}},
        y:{stacked:true,grid:{color:'rgba(0,0,0,.06)'},ticks:{color:'#6b7a94',font:{size:10}},beginAtZero:true}
      }
    }
  });
}

render();
</script>
</body>
</html>
