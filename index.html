<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Indicadores</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600;700&display=swap');
:root{
  --bg:#f4f6f9;--s1:#fff;--s2:#f0f2f5;--s3:#e8ebef;
  --border:#d8dde6;--border2:#c5ccd8;
  --text:#1a2035;--muted:#6b7a94;--muted2:#8892a4;
  --cronos:#0066cc;--dakota:#cc2200;--titano:#cc7700;--total:#1a6e3a;
  --green:#1a8a4a;--red:#cc2200;--orange:#cc7700;--accent:#1d3a8a;
  --d2:#8892a4;--d30:#cc7700;--d50:#cc4400;--d60:#cc2200;
  --dvx-color:#6644aa;--drr-color:#1a7a4a;--kp1-color:#0e7490;
  --sca-color:#7c3aed;--dpv-color:#be185d;--kppm-color:#b45309;--inout-color:#0f766e;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;font-weight:300;min-height:100vh;}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 60px;}
.header{background:var(--accent);padding:0 24px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.header-logo img{height:52px;width:auto;display:block;padding:6px 0;}
.header-title{color:rgba(255,255,255,.85);font-family:'Rajdhani',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;text-align:right;}
.header-title strong{display:block;color:#fff;font-size:1.1rem;letter-spacing:2px;}
.upload-bar{background:var(--s1);border:1px solid var(--border);border-left:4px solid var(--accent);padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-radius:0 6px 6px 0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
.upload-btn{background:var(--accent);color:#fff;font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:9px 20px;cursor:pointer;border:none;border-radius:4px;}
.upload-btn:hover{opacity:.85;}
.download-btn{background:var(--green);color:#fff;font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:9px 20px;cursor:pointer;border:none;border-radius:4px;display:block;}
.download-btn:hover{opacity:.85;}
.upload-status{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--green);display:none;align-items:center;gap:6px;}
.upload-status.visible{display:flex;}
.udot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.embed-info{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--muted2);margin-left:auto;}
.page{display:none;}.page.active{display:block;}
.back-btn{display:inline-flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:8px 18px;cursor:pointer;border-radius:4px;margin-bottom:20px;transition:all .15s;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.page-title-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;margin-bottom:20px;border-bottom:2px solid var(--border);flex-wrap:wrap;gap:8px;}
.page-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:2px;text-transform:uppercase;}
.badge{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted);background:var(--s2);border:1px solid var(--border);padding:5px 12px;letter-spacing:1px;border-radius:4px;}
.badge.hl{background:var(--accent);color:#fff;border-color:var(--accent);}
/* HOME */
.home-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.5rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);padding:20px 0 4px;}
.home-sub{font-size:.75rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;margin-bottom:24px;}
.home-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
@media(max-width:900px){.home-cards{grid-template-columns:repeat(2,1fr);}}
@media(max-width:500px){.home-cards{grid-template-columns:1fr;}}
.home-card{background:var(--s1);border:1px solid var(--border);border-top:4px solid var(--hc);padding:20px;border-radius:0 0 8px 8px;box-shadow:0 4px 16px rgba(0,0,0,.08);cursor:pointer;transition:transform .2s,box-shadow .2s;position:relative;overflow:hidden;}
.home-card:hover{transform:translateY(-4px);box-shadow:0 8px 28px rgba(0,0,0,.13);}
.hc-arrow{position:absolute;top:16px;right:16px;font-size:1rem;color:var(--border2);}
.hc-icon{font-size:1.8rem;margin-bottom:8px;}
.hc-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1rem;letter-spacing:3px;text-transform:uppercase;color:var(--hc);margin-bottom:4px;}
.hc-desc{font-size:.65rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;margin-bottom:14px;line-height:1.5;}
.hc-values{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding-top:14px;border-top:1px solid var(--border);}
.hc-val{text-align:center;}
.hc-val .vlbl{font-size:.52rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;margin-top:2px;letter-spacing:.5px;}
.hc-big{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:3rem;line-height:1;color:var(--hc);margin-bottom:4px;}
.hc-giro-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding-top:12px;border-top:1px solid var(--border);}
/* KP1 card - only 1 model */
.hc-values-kp1{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--border);}
.kp1-row{display:flex;justify-content:space-between;align-items:center;}
.kp1-lbl{font-size:.58rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;}
/* FILTROS */
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center;background:var(--s1);padding:12px 16px;border-radius:6px;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04);}
.fgroup{display:flex;gap:3px;flex-wrap:wrap;}
.flabel{font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-right:4px;align-self:center;white-space:nowrap;}
.fbtn{background:var(--s2);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;cursor:pointer;transition:all .15s;border-radius:4px;}
.fbtn:hover{border-color:var(--accent);color:var(--accent);}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.fbtn.act-cronos{background:var(--cronos);border-color:var(--cronos);color:#fff;}
.fbtn.act-dakota{background:var(--dakota);border-color:var(--dakota);color:#fff;}
.fbtn.act-titano{background:var(--titano);border-color:var(--titano);color:#fff;}
.fbtn.act-kp1{background:var(--kp1-color);border-color:var(--kp1-color);color:#fff;}
.sep{width:1px;height:28px;background:var(--border);margin:0 4px;}
select{background:var(--s1);border:1px solid var(--border);color:var(--text);font-family:'Exo 2',sans-serif;font-size:.78rem;padding:6px 10px;cursor:pointer;outline:none;border-radius:4px;}
/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:800px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
.kcard{background:var(--s1);border:1px solid var(--border);border-top:3px solid var(--mc);padding:16px;border-radius:0 0 6px 6px;box-shadow:0 2px 6px rgba(0,0,0,.06);transition:transform .15s;}
.kcard:hover{transform:translateY(-2px);}
.kc-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--mc);margin-bottom:8px;}
.kc-big{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:3rem;line-height:1;color:var(--mc);}
.kc-sub{font-size:.6rem;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-family:'Share Tech Mono',monospace;}
.kc-alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.mc-alert{text-align:center;padding:4px 2px;}
.mc-alert .av{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;}
.mc-alert .al{font-size:.52rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;}
/* ZONA CARDS */
.zona-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px;}
@media(max-width:900px){.zona-row{grid-template-columns:repeat(3,1fr);}}
.zcard{background:var(--s1);border:1px solid var(--border);border-top:3px solid var(--kc);padding:14px;border-radius:0 0 6px 6px;box-shadow:0 2px 6px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s;}
.zcard:hover{transform:translateY(-2px);}
.zc-zona{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.65rem;letter-spacing:3px;text-transform:uppercase;color:var(--kc);margin-bottom:8px;}
.zc-models{display:flex;flex-direction:column;gap:4px;}
.zm{display:flex;justify-content:space-between;align-items:baseline;}
.zm-name{font-size:.62rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;}
.zm-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.2rem;}
.zc-total{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;}
.zt-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.8rem;color:var(--kc);}
.zt-lbl{font-size:.55rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;}
/* CHART */
.chart-panel{background:var(--s1);border:1px solid var(--border);padding:20px;margin-bottom:16px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.cp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.cp-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
.leg-row{display:flex;gap:12px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:.68rem;color:var(--muted);font-family:'Share Tech Mono',monospace;}
.leg-dot{width:8px;height:8px;border-radius:2px;}
.chart-wrap{position:relative;height:220px;}
/* ALERT TABS */
.alert-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
.atab{background:var(--s1);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;border-radius:4px;}
.atab:hover{border-color:var(--accent);color:var(--accent);}
.atab.active{color:#fff;}
.atab.at-all.active{background:var(--accent);border-color:var(--accent);}
.atab.at-2.active{background:var(--d2);border-color:var(--d2);}
.atab.at-30.active{background:var(--d30);border-color:var(--d30);}
.atab.at-50.active{background:var(--d50);border-color:var(--d50);}
.atab.at-60.active{background:var(--d60);border-color:var(--d60);}
.atab .cnt{font-size:.85rem;font-weight:700;background:rgba(0,0,0,.12);padding:1px 7px;border-radius:3px;}
/* TABLE */
.tbl-panel{background:var(--s1);border:1px solid var(--border);padding:20px;overflow-x:auto;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.sec-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.78rem;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
.srch{background:var(--s2);border:1px solid var(--border);color:var(--text);font-family:'Exo 2',sans-serif;font-size:.78rem;padding:7px 12px;outline:none;width:200px;border-radius:4px;}
.srch::placeholder{color:var(--muted2);}
table{width:100%;border-collapse:collapse;}
thead tr{border-bottom:2px solid var(--border);}
th{font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--accent);padding:9px 12px;text-align:left;cursor:pointer;white-space:nowrap;user-select:none;}
td{padding:8px 12px;border-bottom:1px solid var(--border);font-size:.78rem;color:var(--text);}
tr:hover td{background:var(--s2);}
.tag-cronos{color:var(--cronos);font-weight:600;}.tag-dakota{color:var(--dakota);font-weight:600;}.tag-titano{color:var(--titano);font-weight:600;}.tag-kp1{color:var(--kp1-color);font-weight:600;}
.days-ok{color:var(--muted2);}.days-2{color:var(--d2);font-weight:600;}.days-30{color:var(--d30);font-weight:700;}.days-50{color:var(--d50);font-weight:700;}.days-60{color:var(--d60);font-weight:700;}
.badge-d{display:inline-block;padding:2px 8px;font-size:.62rem;font-weight:700;border-radius:3px;}
.badge-d.d60{background:rgba(204,34,0,.1);color:var(--d60);border:1px solid rgba(204,34,0,.2);}
.badge-d.d50{background:rgba(204,68,0,.1);color:var(--d50);border:1px solid rgba(204,68,0,.2);}
.badge-d.d30{background:rgba(204,119,0,.1);color:var(--d30);border:1px solid rgba(204,119,0,.2);}
.badge-d.d2{background:rgba(136,146,164,.1);color:var(--d2);border:1px solid rgba(136,146,164,.2);}
.badge-d.d0{color:var(--muted2);border:1px solid var(--border);}
.pag{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:flex-end;}
.pag-btn{background:var(--s2);border:1px solid var(--border);color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:.68rem;font-weight:700;padding:6px 14px;cursor:pointer;border-radius:4px;}
.pag-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}.pag-btn:disabled{opacity:.35;cursor:default;}
.pag-info{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted);}
.tally{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted2);}
@media(max-width:600px){
  .wrap{padding:0 10px 60px;}
  .header{padding:0 14px;}
  .header-logo img{height:40px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;}
  .zona-row{grid-template-columns:repeat(2,1fr);gap:8px;}
  .kc-big{font-size:2.2rem;}
  .filtros{padding:10px 12px;}
  .fbtn{padding:5px 10px;font-size:.68rem;}
  .chart-panel{padding:14px 12px;margin-bottom:20px !important;}
  .tbl-panel{padding:14px 10px;}
  td{padding:6px 8px;font-size:.72rem;}
  th{font-size:.6rem;padding:8px 8px;}
  .atab{padding:6px 10px;font-size:.68rem;}
}

/* ROOT PAGE */
.root-page{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px;}
.root-logo{margin-bottom:32px;text-align:center;}
.root-logo img{height:80px;width:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.15));}
.root-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;letter-spacing:6px;text-transform:uppercase;color:var(--muted2);margin-top:12px;}
.root-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;width:100%;max-width:900px;}
@media(max-width:700px){.root-cards{grid-template-columns:1fr;}}
.root-card{background:var(--s1);border:1px solid var(--border);border-top:5px solid var(--rc);padding:32px 24px;border-radius:0 0 12px 12px;box-shadow:0 6px 24px rgba(0,0,0,.08);cursor:pointer;transition:transform .2s,box-shadow .2s;text-align:center;position:relative;}
.root-card:hover{transform:translateY(-6px);box-shadow:0 12px 36px rgba(0,0,0,.14);}
.root-card-icon{font-size:2.8rem;margin-bottom:16px;}
.root-card-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.6rem;letter-spacing:4px;text-transform:uppercase;color:var(--rc);}
.root-card-desc{font-size:.72rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;margin-top:8px;line-height:1.6;}
.root-card-arrow{position:absolute;top:16px;right:16px;font-size:1rem;color:var(--border2);}
.root-coming{opacity:.5;cursor:default;}
.root-coming:hover{transform:none;box-shadow:0 6px 24px rgba(0,0,0,.08);}
.root-coming .root-card-title::after{content:' PRÓXIMAMENTE';font-size:.55rem;display:block;letter-spacing:3px;color:var(--muted2);margin-top:4px;}
</style>
</head>
<body>
<div class="header">
  <div class="header-logo"><img src="" alt="Logo"></div>
  <div class="header-title"><strong>SISTEMA</strong>PANEL GENERAL</div>
</div>
<div class="wrap">
  <div class="upload-bar">
    <input type="file" id="excel-input" style="display:none;">
    <button class="upload-btn" onclick="document.getElementById('excel-input').click()">Cargar Datos</button>
    <button class="download-btn">Descargar Reporte</button>
    <div class="upload-status" id="upload-status"><span class="udot"></span>Datos Procesados</div>
    <div class="embed-info">Estructura Base v1.0</div>
  </div>
</div>
</body></html>
