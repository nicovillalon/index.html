<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giro Industrial — Stellantis Córdoba</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&family=Exo+2:wght@200;300;400;600;800&display=swap');
:root{--bg:#07090d;--s1:#0d1017;--s2:#131720;--s3:#1a2030;--border:#1e2535;--border2:#2a3448;--cronos:#00b4ff;--dakota:#ff3a3a;--titano:#ffaa00;--total:#a0f0a0;--text:#d8dde8;--muted:#4a5568;--muted2:#6b7a94;--green:#00e676;--d2:#6b7a94;--d30:#ffaa00;--d50:#ff7a00;--d60:#ff3a3a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Exo 2',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,180,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,255,.025) 1px,transparent 1px);background-size:48px 48px;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:20px 16px 60px;}
.header{display:flex;align-items:center;justify-content:space-between;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--border);position:relative;}
.header::after{content:'';position:absolute;bottom:-1px;left:0;width:220px;height:1px;background:linear-gradient(90deg,var(--cronos),transparent);}
.logo{display:flex;align-items:center;gap:14px;}
.logo-box{width:38px;height:38px;border:2px solid var(--cronos);display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.9rem;color:var(--cronos);clip-path:polygon(8px 0%,100% 0%,100% calc(100% - 8px),calc(100% - 8px) 100%,0% 100%,0% 8px);}
.logo h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.4rem;letter-spacing:3px;text-transform:uppercase;line-height:1;}
.logo p{font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);margin-top:2px;font-family:'Share Tech Mono',monospace;}
.hright{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.badge{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--muted2);background:var(--s2);border:1px solid var(--border);padding:5px 12px;letter-spacing:1px;clip-path:polygon(6px 0%,100% 0%,100% calc(100% - 6px),calc(100% - 6px) 100%,0% 100%,0% 6px);}
.upload-bar{background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--cronos);padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.upload-btn{background:var(--cronos);color:#000;font-family:'Rajdhani',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:9px 20px;cursor:pointer;border:none;display:flex;align-items:center;gap:8px;clip-path:polygon(6px 0%,100% 0%,100% calc(100% - 6px),calc(100% - 6px) 100%,0% 100%,0% 6px);transition:opacity .2s;}
.upload-btn:hover{opacity:.85;}
.upload-status{font-family:'Share Tech Mono',monospace;font-size:.68rem;color:var(--green);display:none;align-items:center;gap:6px;}
.upload-status.visible{display:flex;}
.udot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.embed-info{font-family:'Share Tech Mono',monospace;font-size:.62rem;color:var(--muted);margin-left:auto;}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
.fgroup{display:flex;gap:3px;}
.flabel{font-family:'Rajdhani',sans-serif;font-size:.65rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-right:4px;align-self:center;}
.fbtn{background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 14px;cursor:pointer;transition:all .15s;}
.fbtn:hover{border-color:var(--cronos);color:var(--cronos);}
.fbtn.active{background:var(--cronos);color:#000;border-color:var(--cronos);}
.fbtn.act-dakota{background:var(--dakota);border-color:var(--dakota);color:#fff;}
.fbtn.act-titano{background:var(--titano);border-color:var(--titano);color:#000;}
.fbtn.act-cronos{background:var(--cronos);border-color:var(--cronos);color:#000;}
.sep{width:1px;height:28px;background:var(--border);margin:0 4px;}
select{background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:700;padding:6px 10px;cursor:pointer;outline:none;transition:border-color .15s;}
select:focus{border-color:var(--cronos);}
select option{background:var(--s2);}
.model-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
@media(max-width:800px){.model-row{grid-template-columns:repeat(2,1fr);}}
.mcard{background:var(--s1);border:1px solid var(--border);border-top:2px solid var(--mc);padding:16px;position:relative;overflow:hidden;transition:transform .15s;}
.mcard:hover{transform:translateY(-2px);}
.mcard::before{content:'';position:absolute;top:0;right:0;width:70px;height:70px;background:radial-gradient(circle at top right,color-mix(in srgb,var(--mc) 10%,transparent),transparent 70%);pointer-events:none;}
.mc-label{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--mc);margin-bottom:10px;}
.mc-big{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:3rem;line-height:1;color:var(--mc);}
.mc-sub{font-size:.6rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px;font-family:'Share Tech Mono',monospace;}
.mc-alerts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.mc-alert{text-align:center;padding:4px 2px;border-radius:2px;cursor:pointer;transition:background .15s;}
.mc-alert:hover{background:var(--s3);}
.mc-alert .av{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.1rem;}
.mc-alert .al{font-size:.52rem;color:var(--muted);letter-spacing:.5px;font-family:'Share Tech Mono',monospace;}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:20px;}
@media(max-width:900px){.kpi-row{grid-template-columns:repeat(3,1fr);}}
.kcard{background:var(--s1);border:1px solid var(--border);border-top:2px solid var(--kc,var(--cronos));padding:14px;transition:transform .15s;cursor:pointer;}
.kcard:hover{transform:translateY(-2px);border-color:var(--kc,var(--cronos));}
.kc-zona{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.62rem;letter-spacing:3px;text-transform:uppercase;color:var(--kc,var(--cronos));margin-bottom:8px;}
.kc-models{display:flex;flex-direction:column;gap:4px;}
.km{display:flex;justify-content:space-between;align-items:baseline;}
.km-name{font-size:.6rem;color:var(--muted);letter-spacing:1px;font-family:'Share Tech Mono',monospace;}
.km-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.2rem;}
.kc-total{margin-top:10px;padding-top:8px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:baseline;}
.t-val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.8rem;color:var(--kc,var(--cronos));}
.t-lbl{font-size:.55rem;color:var(--muted);letter-spacing:1px;font-family:'Share Tech Mono',monospace;}
.chart-panel{background:var(--s1);border:1px solid var(--border);padding:18px;margin-bottom:16px;}
.cp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.cp-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);}
.leg-row{display:flex;gap:12px;flex-wrap:wrap;}
.leg{display:flex;align-items:center;gap:5px;font-size:.65rem;color:var(--muted2);font-family:'Share Tech Mono',monospace;}
.leg-dot{width:8px;height:8px;border-radius:2px;}
.chart-wrap{position:relative;height:220px;}
.alert-tabs{display:flex;gap:3px;margin-bottom:16px;flex-wrap:wrap;}
.atab{background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-family:'Rajdhani',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px 16px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:8px;}
.atab:hover{border-color:var(--cronos);}
.atab.active{color:#000;}
.atab.at-all.active{background:var(--muted2);border-color:var(--muted2);color:var(--text);}
.atab.at-2.active{background:var(--d2);border-color:var(--d2);color:var(--text);}
.atab.at-30.active{background:var(--d30);border-color:var(--d30);}
.atab.at-50.active{background:var(--d50);border-color:var(--d50);}
.atab.at-60.active{background:var(--d60);border-color:var(--d60);}
.atab .cnt{font-size:.85rem;font-weight:700;background:rgba(0,0,0,.25);padding:1px 7px;border-radius:2px;}
.tbl-panel{background:var(--s1);border:1px solid var(--border);padding:18px;overflow-x:auto;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
.sec-title{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:.75rem;letter-spacing:3px;text-transform:uppercase;color:var(--muted2);}
.srch{background:var(--s3);border:1px solid var(--border2);color:var(--text);font-family:'Share Tech Mono',monospace;font-size:.72rem;padding:6px 12px;outline:none;width:200px;transition:border-color .2s;}
.srch:focus{border-color:var(--cronos);}
.srch::placeholder{color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:.75rem;}
thead tr{border-bottom:1px solid var(--border2);}
th{font-family:'Rajdhani',sans-serif;font-size:.62rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:8px 10px;text-align:left;cursor:pointer;white-space:nowrap;user-select:none;}
th:hover{color:var(--text);}
td{padding:7px 10px;border-bottom:1px solid rgba(30,37,53,.5);font-family:'Share Tech Mono',monospace;font-size:.7rem;color:var(--muted2);white-space:nowrap;}
tr:hover td{background:var(--s2);}
.tag-cronos{color:var(--cronos);font-weight:600;}
.tag-dakota{color:var(--dakota);font-weight:600;}
.tag-titano{color:var(--titano);font-weight:600;}
.days-ok{color:var(--muted2);}
.days-2{color:var(--d2);font-weight:600;}
.days-30{color:var(--d30);font-weight:700;}
.days-50{color:var(--d50);font-weight:700;}
.days-60{color:var(--d60);font-weight:700;}
.badge-d{display:inline-block;padding:2px 8px;font-size:.62rem;font-weight:700;letter-spacing:1px;}
.badge-d.d60{background:rgba(255,58,58,.15);color:var(--d60);border:1px solid rgba(255,58,58,.3);}
.badge-d.d50{background:rgba(255,122,0,.15);color:var(--d50);border:1px solid rgba(255,122,0,.3);}
.badge-d.d30{background:rgba(255,170,0,.15);color:var(--d30);border:1px solid rgba(255,170,0,.3);}
.badge-d.d2{background:rgba(107,122,148,.12);color:var(--d2);border:1px solid rgba(107,122,148,.2);}
.badge-d.d0{color:var(--muted);border:1px solid var(--border);}
.pag{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:flex-end;}
.pag-btn{background:var(--s2);border:1px solid var(--border);color:var(--muted2);font-family:'Rajdhani',sans-serif;font-size:.68rem;font-weight:700;letter-spacing:1px;padding:5px 12px;cursor:pointer;transition:all .15s;}
.pag-btn:hover:not(:disabled){border-color:var(--cronos);color:var(--cronos);}
.pag-btn:disabled{opacity:.3;cursor:default;}
.pag-info{font-family:'Share Tech Mono',monospace;font-size:.65rem;color:var(--muted);}
.tally{font-family:'Share Tech Mono',monospace;font-size:.65rem;color:var(--muted);}
</style>
</head>
<body>
<div class="wrap">
<div class="header">
  <div class="logo">
    <div class="logo-box">ST</div>
    <div><h1>Giro Industrial</h1><p>Stellantis · Planta Córdoba</p></div>
  </div>
  <div class="hright">
    <span class="badge" id="date-badge">23/05/2026</span>
    <span class="badge" id="total-badge">479 CHASIS</span>
  </div>
</div>

<div class="upload-bar">
  <button class="upload-btn" onclick="document.getElementById('file-upload').click()">
    📂 CARGAR EXCEL ACTUALIZADO
  </button>
  <input type="file" id="file-upload" accept=".xlsx,.xls" style="display:none" onchange="loadExcel(this)">
  <div class="upload-status" id="upload-status">
    <span class="udot"></span>
    <span id="upload-msg"></span>
  </div>
  <span class="embed-info">Datos: 23/05/2026 · 479 chasis embebidos</span>
</div>

<div class="filtros">
  <span class="flabel">Modelo</span>
  <div class="fgroup" id="fg-modelo">
    <button class="fbtn active" onclick="setModelo('TODOS',this)">TODOS</button>
    <button class="fbtn" onclick="setModelo('CRONOS',this)">CRONOS</button>
    <button class="fbtn" onclick="setModelo('DAKOTA',this)">DAKOTA</button>
    <button class="fbtn" onclick="setModelo('TITANO',this)">TITANO</button>
  </div>
  <div class="sep"></div>
  <span class="flabel">Zona</span>
  <div class="fgroup" id="fg-zona">
    <button class="fbtn active" onclick="setZona('TODAS',this)">TODAS</button>
    <button class="fbtn" onclick="setZona('E-M',this)">E-M</button>
    <button class="fbtn" onclick="setZona('M-F',this)">M-F</button>
    <button class="fbtn" onclick="setZona('F-X',this)">F-X</button>
    <button class="fbtn" onclick="setZona('X-G',this)">X-G</button>
  </div>
  <div class="sep"></div>
  <span class="flabel">Versión</span>
  <select id="sel-ver" onchange="setVer(this.value)"><option value="TODAS">TODAS</option></select>
</div>

<div class="model-row" id="model-cards"></div>
<div class="kpi-row" id="zona-cards"></div>

<div class="chart-panel">
  <div class="cp-head">
    <span class="cp-title">Distribución por zona y modelo</span>
    <div class="leg-row">
      <div class="leg"><div class="leg-dot" style="background:var(--cronos)"></div>CRONOS</div>
      <div class="leg"><div class="leg-dot" style="background:var(--dakota)"></div>DAKOTA</div>
      <div class="leg"><div class="leg-dot" style="background:var(--titano)"></div>TITANO</div>
    </div>
  </div>
  <div class="chart-wrap"><canvas id="zona-chart"></canvas></div>
</div>

<div class="alert-tabs">
  <button class="atab at-all active" onclick="setAlerta('TODOS',this)">TODOS <span class="cnt" id="cnt-all">0</span></button>
  <button class="atab at-2" onclick="setAlerta('>2',this)">&gt;2 DÍAS <span class="cnt" id="cnt-2">0</span></button>
  <button class="atab at-30" onclick="setAlerta('>30',this)">&gt;30 DÍAS <span class="cnt" id="cnt-30">0</span></button>
  <button class="atab at-50" onclick="setAlerta('>50',this)">&gt;50 DÍAS <span class="cnt" id="cnt-50">0</span></button>
  <button class="atab at-60" onclick="setAlerta('>60',this)">&gt;60 DÍAS <span class="cnt" id="cnt-60">0</span></button>
</div>

<div class="tbl-panel">
  <div class="sec-head">
    <span class="sec-title">Chasis en planta</span>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="tally" id="tally-txt"></span>
      <input class="srch" type="text" placeholder="Buscar chasis..." oninput="setSearch(this.value)">
    </div>
  </div>
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('chasis')">CHASIS ⇅</th>
        <th onclick="sortBy('modelo')">MODELO ⇅</th>
        <th onclick="sortBy('ver')">VER ⇅</th>
        <th onclick="sortBy('zona')">ZONA ⇅</th>
        <th onclick="sortBy('estacion')">ESTACIÓN ⇅</th>
        <th onclick="sortBy('dt_tr')">ENTRADA ⇅</th>
        <th onclick="sortBy('dias')">DÍAS ⇅</th>
        <th>ALERTA</th>
      </tr>
    </thead>
    <tbody id="tbl-body"></tbody>
  </table>
  <div class="pag">
    <button class="pag-btn" onclick="changePage(-1)" id="btn-prev">◀ ANT</button>
    <span class="pag-info" id="pag-info">1 / 1</span>
    <button class="pag-btn" onclick="changePage(1)" id="btn-next">SIG ▶</button>
  </div>
</div>
</div>

function initVer(data){
  const vers=[...new Set(data.map(r=>r.ver))].sort();

  sel.innerHTML='<option value="TODAS">TODAS</option>';
  vers.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;sel.appendChild(o);});
}
initVer(RAW);

function loadExcel(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false});
      const today=new Date(); today.setHours(0,0,0,0);
      const MM={'5791':'TITANO','5810':'DAKOTA','3590':'CRONOS'};
      function gz(est){const e=String(est||'').trim().toUpperCase();if(e.startsWith('E'))return'E-M';if(e.startsWith('M'))return'M-F';if(e.startsWith('F'))return'F-X';if(e.startsWith('X'))return'X-G';return'OTRO';}
      const nd=[];
      for(let i=1;i<rows.length;i++){
        const r=rows[i];if(!r||!r[5])continue;
        let dt=r[5] instanceof Date?r[5]:new Date(r[5]);
        if(isNaN(dt))continue;
        dt.setHours(0,0,0,0);
        const dias=Math.round((today-dt)/86400000);
        const mc=String(r[3]||'').trim();
        const est=String(r[16]||'').trim();
        nd.push({chasis:String(r[9]||'').trim(),modelo:MM[mc]||mc,ver:String(r[12]||'').trim(),estacion:est,zona:gz(est),dias,dt_tr:dt.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})});
      }
      RAW=nd;
      initVer(RAW);
      const ts=today.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
      document.getElementById('date-badge').textContent=ts;
      document.getElementById('upload-msg').textContent=file.name+' · '+nd.length+' chasis cargados';
      document.getElementById('upload-status').classList.add('visible');
      fModelo='TODOS';fZona='TODAS';fVer='TODAS';fAlerta='TODOS';fSearch='';page=1;
      document.querySelector('#fg-modelo .fbtn').className='fbtn active';
      document.querySelector('#fg-zona .fbtn').className='fbtn active';
      document.getElementById('fg-modelo').querySelectorAll('.fbtn').forEach((b,i)=>{if(i>0)b.className='fbtn';});
      document.getElementById('fg-zona').querySelectorAll('.fbtn').forEach((b,i)=>{if(i>0)b.className='fbtn';});
      render();
    }catch(err){alert('Error al leer el Excel: '+err.message);}
  };
  reader.readAsArrayBuffer(file);
}

function sortBy(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=col==='dias'?-1:1;}render();}

function getBase(){return RAW.filter(r=>{if(fModelo!=='TODOS'&&r.modelo!==fModelo)return false;if(fZona!=='TODAS'&&r.zona!==fZona)return false;if(fVer!=='TODAS'&&r.ver!==fVer)return false;if(fSearch&&!r.chasis.toUpperCase().includes(fSearch))return false;return true;});}
function getFilt(base){return base.filter(r=>{if(fAlerta==='>2'&&r.dias<=2)return false;if(fAlerta==='>30'&&r.dias<=30)return false;if(fAlerta==='>50'&&r.dias<=50)return false;if(fAlerta==='>60'&&r.dias<=60)return false;return true;});}
function dc(d){if(d>60)return'days-60';if(d>50)return'days-50';if(d>30)return'days-30';if(d>2)return'days-2';return'days-ok';}
function db(d){if(d>60)return'<span class="badge-d d60">+60D</span>';if(d>50)return'<span class="badge-d d50">+50D</span>';if(d>30)return'<span class="badge-d d30">+30D</span>';if(d>2)return'<span class="badge-d d2">+2D</span>';return'<span class="badge-d d0">OK</span>';}

function render(){
  const base=getBase(),filtered=getFilt(base);
  filtered.sort((a,b)=>{let va=a[sortCol],vb=b[sortCol];if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}return va<vb?-sortDir:va>vb?sortDir:0;});
  document.getElementById('cnt-all').textContent=base.length;

  document.getElementById('total-badge').textContent=filtered.length+' CHASIS';
  document.getElementById('tally-txt').textContent=filtered.length+' resultados';
  renderMCards(base);renderZCards(base);renderChart(base);
  const tp=Math.max(1,Math.ceil(filtered.length/PAGE_SIZE));
  page=Math.min(page,tp);
  const pg=filtered.slice((page-1)*PAGE_SIZE,page*PAGE_SIZE);
  document.getElementById('pag-info').textContent=page+' / '+tp;
  document.getElementById('btn-prev').disabled=page<=1;
  document.getElementById('btn-next').disabled=page>=tp;
  const tbody=document.getElementById('tbl-body');tbody.innerHTML='';
  pg.forEach(r=>{const mc=r.modelo==='CRONOS'?'tag-cronos':r.modelo==='DAKOTA'?'tag-dakota':'tag-titano';tbody.innerHTML+=`<tr><td style="color:var(--text);font-weight:600;">${r.chasis}</td><td class="${mc}">${r.modelo}</td><td>${r.ver}</td><td>${r.zona}</td><td>${r.estacion}</td><td>${r.dt_tr}</td><td class="${dc(r.dias)}">${r.dias}</td><td>${db(r.dias)}</td></tr>`;});
}

function renderMCards(data){
  const C={CRONOS:'var(--cronos)',DAKOTA:'var(--dakota)',TITANO:'var(--titano)',TOTAL:'var(--total)'};
  const g=document.getElementById('model-cards');g.innerHTML='';
  ['CRONOS','DAKOTA','TITANO','TOTAL'].forEach(m=>{
    const a=m==='TOTAL'?data:data.filter(r=>r.modelo===m);
    const d60=a.filter(r=>r.dias>60).length,d50=a.filter(r=>r.dias>50&&r.dias<=60).length,d30=a.filter(r=>r.dias>30&&r.dias<=50).length,d2=a.filter(r=>r.dias>2&&r.dias<=30).length;
    g.innerHTML+=`<div class="mcard" style="--mc:${C[m]}"><div class="mc-label">${m}</div><div class="mc-big">${a.length}</div><div class="mc-sub">CHASIS E-G</div><div class="mc-alerts"><div class="mc-alert"><div class="av" style="color:var(--d2)">${d2}</div><div class="al">&gt;2D</div></div><div class="mc-alert"><div class="av" style="color:var(--d30)">${d30}</div><div class="al">&gt;30D</div></div><div class="mc-alert"><div class="av" style="color:var(--d50)">${d50}</div><div class="al">&gt;50D</div></div><div class="mc-alert"><div class="av" style="color:var(--d60)">${d60}</div><div class="al">&gt;60D</div></div></div></div>`;
  });
}

function renderZCards(data){
  const ZC={'E-M':'#00b4ff','M-F':'#a78bfa','F-X':'#34d399','X-G':'#fb923c','E-G':'#a0f0a0'};
  const g=document.getElementById('zona-cards');g.innerHTML='';
  ['E-M','M-F','F-X','X-G','E-G'].forEach(z=>{
    const a=z==='E-G'?data:data.filter(r=>r.zona===z);
    const cr=a.filter(r=>r.modelo==='CRONOS').length,dk=a.filter(r=>r.modelo==='DAKOTA').length,ti=a.filter(r=>r.modelo==='TITANO').length;
    const zf=z==='E-G'?'TODAS':z;
    g.innerHTML+=`<div class="kcard" onclick="setZona('${zf}',this)" style="--kc:${ZC[z]}"><div class="kc-zona">${z}</div><div class="kc-models"><div class="km"><span class="km-name" style="color:var(--cronos)">CRONOS</span><span class="km-val" style="color:var(--cronos)">${cr}</span></div><div class="km"><span class="km-name" style="color:var(--dakota)">DAKOTA</span><span class="km-val" style="color:var(--dakota)">${dk}</span></div><div class="km"><span class="km-name" style="color:var(--titano)">TITANO</span><span class="km-val" style="color:var(--titano)">${ti}</span></div></div><div class="kc-total"><span class="t-val">${a.length}</span><span class="t-lbl">TOTAL<br>CHASIS</span></div></div>`;
  });
}

function renderChart(data){
  const L=['E-M','M-F','F-X','X-G'];
  const crD=L.map(z=>data.filter(r=>r.zona===z&&r.modelo==='CRONOS').length);
  const dkD=L.map(z=>data.filter(r=>r.zona===z&&r.modelo==='DAKOTA').length);
  const tiD=L.map(z=>data.filter(r=>r.zona===z&&r.modelo==='TITANO').length);
  if(zChart)zChart.destroy();
  zChart=new Chart(document.getElementById('zona-chart').getContext('2d'),{type:'bar',data:{labels:L,datasets:[{label:'Cronos',data:crD,backgroundColor:'rgba(0,180,255,.75)',borderColor:'#00b4ff',borderWidth:1},{label:'Dakota',data:dkD,backgroundColor:'rgba(255,58,58,.75)',borderColor:'#ff3a3a',borderWidth:1},{label:'Titano',data:tiD,backgroundColor:'rgba(255,170,0,.75)',borderColor:'#ffaa00',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#0d1017',borderColor:'#1e2535',borderWidth:1,titleColor:'#4a5568',bodyColor:'#d8dde8',padding:10}},scales:{x:{stacked:true,grid:{color:'rgba(30,37,53,.5)'},ticks:{color:'#6b7a94',font:{size:10}}},y:{stacked:true,grid:{color:'rgba(30,37,53,.5)'},ticks:{color:'#6b7a94',font:{size:10}},beginAtZero:true}}}});
}

render();
</script>
</body>
